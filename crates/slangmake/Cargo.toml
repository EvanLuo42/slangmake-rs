[package]
name = "slangmake"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Idiomatic Rust wrapper around slangmake (https://github.com/EvanLuo42/slangmake)"
documentation = "https://docs.rs/slangmake"
readme = "README.md"
keywords = ["slang", "shader", "graphics", "vulkan", "spirv"]
categories = ["api-bindings", "graphics", "rendering"]
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
default = ["runtime", "compiler"]
runtime = ["slangmake-sys/runtime"]
compiler = ["slangmake-sys/compiler", "runtime"]

[dependencies]
slangmake-sys = { path = "../slangmake-sys", version = "=0.4.1", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "compile_and_pack"
required-features = ["compiler", "runtime"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
